server.port=8080
server.address=127.0.0.1
server.shutdown=graceful
spring.application.name=aqp-balancer
spring.mvc.problemdetails.enabled=true
spring.lifecycle.timeout-per-shutdown-phase=20s
spring.task.scheduling.pool.size=4

# Persistence of connected servers
# Use an absolute path or BALANCER_SERVERS_FILE in containers.
balancer.servers-file=${BALANCER_SERVERS_FILE:./data/connected-servers.json}

# Demo mode: simulated servers, /api/simulate and /api/stream.
# Disabled by default so the runtime is a standalone balancer.
balancer.demo.enabled=false

# Health-check and live-load polling
balancer.health-check.interval-ms=15000
balancer.health-check.initial-delay-ms=3000
balancer.health-check.timeout-ms=2000
balancer.health-check.threads=4
balancer.load-poll.interval-ms=1000
balancer.load-poll.initial-delay-ms=1000
balancer.load-poll.threads=4

# Discovery is opt-in. Enable it only in a trusted environment.
balancer.discovery.enabled=false
balancer.discovery.hosts=
balancer.discovery.port-start=9001
balancer.discovery.port-end=9010

# Active-set autoscaling
balancer.active-set.min-size=1
balancer.active-set.max-size=100
balancer.active-set.scale-out-utilization=0.70
balancer.active-set.scale-in-utilization=0.25
balancer.active-set.scale-in-cooldown-ms=15000
balancer.active-set.tick-ms=3000

# Admission control
balancer.admission.warning-utilization=0.70
balancer.admission.critical-utilization=0.90
balancer.admission.overload-factor=1.20

# Adaptive loop (previously hardcoded)
balancer.adaptive.latency-window-size=1000
balancer.adaptive.min-estimation-samples=20
balancer.adaptive.refresh-interval-ms=1000
balancer.adaptive.refresh-sample-interval=100
balancer.adaptive.default-alpha=2.5
balancer.adaptive.detector-min-samples=8
balancer.adaptive.detector-max-history=120
balancer.adaptive.cusum-baseline=2.2
balancer.adaptive.cusum-drift=0.05
balancer.adaptive.cusum-threshold=1.0
balancer.adaptive.reward-accuracy-weight=0.7
balancer.adaptive.reward-latency-weight=0.3
balancer.adaptive.reward-latency-scale-ms=10000

# Seed for reproducible Thompson Sampling
balancer.runtime.seed=42

# Admin API protection. An empty token allows loopback clients only.
balancer.admin.token=${BALANCER_ADMIN_TOKEN:}
balancer.admin.allow-loopback=true

# Observability
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.endpoint.health.group.readiness.include=readinessState,balancer
